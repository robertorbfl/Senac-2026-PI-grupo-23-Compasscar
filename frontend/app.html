<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CompassCar - Sistema</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body class="app-body">
    <header class="header">
      <div class="container header__content">
        <a href="./index.html" class="logo">
          <span class="logo__icon">🚗</span> CompassCar
        </a>
        <nav class="nav">
          <a href="./index.html">← Voltar à landing</a>
        </nav>
      </div>
    </header>

    <main class="container app">
      <!-- Config da API -->
      <section class="panel">
        <h2>Conexão com a API</h2>
        <div class="form-row">
          <label for="apiUrl">URL base da API</label>
          <div class="form-inline">
            <input
              type="text"
              id="apiUrl"
              placeholder="http://localhost:3000"
              value="http://localhost:3000"
            />
            <button class="btn btn--small" id="saveApiUrl">Salvar</button>
          </div>
          <small class="hint">
            Ex.: <code>http://localhost:3000</code>. A URL é salva no navegador.
          </small>
        </div>
      </section>

      <div class="app-grid">
        <!-- Cadastro -->
        <section class="panel">
          <h2>Cadastrar veículo</h2>
          <form id="createForm">
            <div class="form-row">
              <label for="brand">Marca</label>
              <input type="text" id="brand" required placeholder="Volkswagen" />
            </div>
            <div class="form-row">
              <label for="model">Modelo</label>
              <input type="text" id="model" required placeholder="GOL G5" />
            </div>
            <div class="form-row">
              <label for="year">Ano</label>
              <input type="number" id="year" required placeholder="2021" />
            </div>
            <div class="form-row">
              <label for="items">Itens (separados por vírgula)</label>
              <input
                type="text"
                id="items"
                placeholder="Ar-condicionado, Direção Hidráulica"
              />
            </div>
            <button type="submit" class="btn">Cadastrar</button>
          </form>
        </section>

        <!-- Filtros -->
        <section class="panel">
          <h2>Filtrar frota</h2>
          <form id="filterForm">
            <div class="form-row">
              <label for="fBrand">Marca contém</label>
              <input type="text" id="fBrand" placeholder="vol" />
            </div>
            <div class="form-row">
              <label for="fModel">Modelo contém</label>
              <input type="text" id="fModel" placeholder="gol" />
            </div>
            <div class="form-row">
              <label for="fYear">Ano a partir de</label>
              <input type="number" id="fYear" placeholder="2015" />
            </div>
            <button type="submit" class="btn">Filtrar</button>
            <button type="button" class="btn btn--ghost" id="clearFilter">
              Limpar
            </button>
          </form>
        </section>
      </div>

      <!-- Lista -->
      <section class="panel">
        <div class="panel__head">
          <h2>Veículos cadastrados</h2>
          <button class="btn btn--small" id="reload">Recarregar</button>
        </div>
        <div id="status" class="status"></div>
        <div id="carList" class="car-list"></div>
        <div id="pagination" class="pagination"></div>
      </section>
    </main>

    <footer class="footer">
      <div class="container">
        <p>CompassCar © 2026 — Projeto Integrador SENAC · Grupo 23</p>
      </div>
    </footer>

    <script src="./js/app.js"></script>
  </body>
</html>
